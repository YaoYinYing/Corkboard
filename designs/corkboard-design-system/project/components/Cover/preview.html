<!doctype html>
<html lang="en">

<meta charset="utf-8">
<title>Corkboard</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--surface); color: var(--ink); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; height: 288px; overflow: hidden; }
  .words { position: absolute; left: var(--space-6); right: var(--space-6); bottom: var(--space-6); max-width: 440px; }
  .name { margin: 0; font-size: 80px; line-height: 0.9; font-weight: 700; color: var(--ink); }
  .tag { margin: var(--space-2) 0 0; font-size: 14px; line-height: 20px; color: var(--ink-muted); }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }
  .brand { fill: var(--brand); }
  .ink { fill: var(--ink); }
  .accent { fill: var(--accent); }
  .danger { fill: var(--danger); }
  .cut { fill: var(--surface); }
  .slab { rx: var(--radius-md); }
  .chip { rx: var(--radius-sm); }
</style>
</head>

<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288" role="presentation">

  pattern     plus grid at a space-6 (24px) pitch cut out of the ink slab in surface; chosen from the README's 4px grid and "precise, technical, borders not shadows" character
  scales      sides in space-1 multiples; gutters space-4; pattern pitch space-6 with 12px (space-3) arms; corners radius-md on slabs, radius-sm on the chip
